[package]
name = "pg_temporal"
version = "0.0.1"
edition = "2024"
description = "Temporal-compliant date/time types for PostgreSQL"
license = "MIT"
build = "build.rs"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = { version = "0.19.3", default-features = false }
temporal_rs = { version = "0.2.6", default-features = false, features = [
    "compiled_data",
] }
timezone_provider = "0.2.6"

[target.'cfg(windows)'.dependencies]
pgrx = { version = "0.19.3", default-features = false, features = ["cshim"] }

[build-dependencies]
timezone_provider = "0.2.6"
zerovec = { version = "0.11.9", features = ["derive"] }
zerotrie = "0.2.5"

[dev-dependencies]
pgrx-tests = "0.19.3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "tz_lookup"
path = "benchmarking/tz_lookup.rs"
harness = false

[package.metadata.bin]
cargo-pgrx = { version = "0.19.3", locked = true }
cargo-release = { version = "1.1.7", locked = true }

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
# Transitive dependency version conflicts we don't control.
multiple_crate_versions = "allow"
