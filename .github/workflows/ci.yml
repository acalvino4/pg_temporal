name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# All jobs only need to read repository contents.
permissions:
  contents: read

jobs:
  # ── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  # ── Clippy ──────────────────────────────────────────────────────────────────
  # Run against one PG version; linting doesn't need to be exhaustive per version.
  clippy:
    name: clippy
    needs: fmt
    runs-on: ubuntu-latest
    env:
      PG_VER: "17"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install clippy
        run: rustup component add clippy

      - uses: ./.github/actions/setup-linux-pg
        with:
          pg-version: ${{ env.PG_VER }}

      - uses: ./.github/actions/install-tools

      - name: Initialize pgrx
        run: cargo pgrx init --pg${{ env.PG_VER }} /usr/lib/postgresql/${{ env.PG_VER }}/bin/pg_config

      - name: Clippy
        run: cargo clippy --no-default-features --features pg${{ env.PG_VER }} -- -Dwarnings

  # ── Tests: Linux ────────────────────────────────────────────────────────────
  test-linux:
    name: "test linux (pg${{ matrix.pg }})"
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # All three pg-version jobs share one build cache — most compiled code
      # (temporal_rs, icu, pgrx proc-macros, etc.) is identical across versions.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test-linux
          cache-on-failure: true

      - uses: ./.github/actions/setup-linux-pg
        with:
          pg-version: ${{ matrix.pg }}

      - uses: ./.github/actions/install-tools

      - name: Initialize pgrx
        run: cargo pgrx init --pg${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Test
        run: cargo pgrx test pg${{ matrix.pg }} --no-default-features

  # ── Tests: macOS ────────────────────────────────────────────────────────────
  test-macos:
    name: "test macos (pg${{ matrix.pg }})"
    needs: fmt
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test-macos
          cache-on-failure: true

      - uses: ./.github/actions/setup-macos-pg
        with:
          pg-version: ${{ matrix.pg }}

      - uses: ./.github/actions/install-tools

      - name: Initialize pgrx
        run: cargo pgrx init --pg${{ matrix.pg }} "$PG_CONFIG"

      - name: Test
        run: cargo pgrx test pg${{ matrix.pg }} --no-default-features

  # ── Tests: Windows ──────────────────────────────────────────────────────────
  # Note: pg17 only; PostgreSQL is compiled from source via --download, so this
  # job takes ~45 minutes on a cold cache.
  test-windows:
    name: "test windows (pg17)"
    needs: fmt
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - uses: ./.github/actions/install-tools

      # Cache the compiled PostgreSQL sources to avoid recompiling every run.
      - name: Cache pgrx PostgreSQL download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pgrx
          key: pgrx-pg17-${{ runner.os }}-${{ runner.arch }}-0.18.0

      - name: Initialize pgrx (download & compile PostgreSQL 17)
        shell: bash
        run: cargo pgrx init --pg17=download

      - name: Test
        shell: bash
        run: cargo pgrx test pg17 --no-default-features
