name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# All jobs only need to read repository contents.
permissions:
  contents: read

jobs:
  # ── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  # ── Clippy ──────────────────────────────────────────────────────────────────
  # Run against one PG version; linting doesn't need to be exhaustive per version.
  clippy:
    name: clippy
    needs: fmt
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools@sha256:a54f1e66c563c7e47b34ed08597d0ee5da1168303b61ef47e66a4a9904ab849d
    env:
      PG_VER: "17"
    steps:
      - name: Install PostgreSQL ${{ env.PG_VER }}
        run: pg-start ${{ env.PG_VER }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: ./.github/actions/install-tools

      - name: Install clippy
        run: rustup component add clippy

      - name: Initialize pgrx
        run: cargo pgrx init --pg${{ env.PG_VER }} "$(which pg_config)"

      - name: Clippy
        run: cargo clippy --no-default-features --features pg${{ env.PG_VER }} -- -Dwarnings

  # ── Tests: Linux ────────────────────────────────────────────────────────────
  test-linux:
    name: "test linux (pg${{ matrix.pg }})"
    needs: fmt
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools@sha256:a54f1e66c563c7e47b34ed08597d0ee5da1168303b61ef47e66a4a9904ab849d
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    steps:
      - name: Install PostgreSQL ${{ matrix.pg }}
        run: pg-start ${{ matrix.pg }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # All three pg-version jobs share one build cache — most compiled code
      # (temporal_rs, icu, pgrx proc-macros, etc.) is identical across versions.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: test-linux
          cache-on-failure: true

      - uses: ./.github/actions/install-tools

      - name: Initialize pgrx
        run: cargo pgrx init --pg${{ matrix.pg }} "$(which pg_config)"

      - name: Test
        run: cargo pgrx test pg${{ matrix.pg }} --no-default-features --runas postgres --pgdata /var/lib/postgresql/pgrx

  # ── Tests: macOS ──────────────────────────────────────────────────────────
  test-macos:
    name: "test macos (pg${{ matrix.pg }})"
    needs: fmt
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: test-macos
          cache-on-failure: true

      - uses: ./.github/actions/setup-macos-pg
        with:
          pg-version: ${{ matrix.pg }}

      - uses: ./.github/actions/install-tools

      - name: Initialize pgrx
        run: cargo pgrx init --pg${{ matrix.pg }} "$PG_CONFIG"

      - name: Test
        run: cargo pgrx test pg${{ matrix.pg }} --no-default-features

  # ── Tests: Windows ──────────────────────────────────────────────────────────
  # Note: pg17 only; PostgreSQL is compiled from source via --download, so this
  # job takes ~45 minutes on a cold cache.
  test-windows:
    name: "test windows (pg17)"
    needs: fmt
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - uses: ./.github/actions/install-tools

      # Cache the compiled PostgreSQL sources to avoid recompiling every run.
      - name: Cache pgrx PostgreSQL download
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.pgrx
          key: pgrx-pg17-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Initialize pgrx (download & compile PostgreSQL 17)
        shell: bash
        run: cargo pgrx init --pg17=download

      - name: Test
        shell: bash
        run: cargo pgrx test pg17 --no-default-features
