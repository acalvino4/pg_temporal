name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for artifact naming (e.g. 0.1.0)"
        required: true
        default: "0.0.0-test"

env:
  CARGO_TERM_COLOR: always
  GH_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

# Deny all token permissions by default; individual jobs grant only what they need.
permissions: {}

jobs:
  # ── Build binary packages: Linux ─────────────────────────────────────────────
  # Produces one .tar.gz per PG version for linux-amd64.
  build-linux:
    name: "build linux-amd64 pg${{ matrix.pg }}"
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools@sha256:a54f1e66c563c7e47b34ed08597d0ee5da1168303b61ef47e66a4a9904ab849d
    steps:
      - name: Install PostgreSQL ${{ matrix.pg }}
        run: pg-start ${{ matrix.pg }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-linux
          cache-on-failure: true

      - uses: ./.github/actions/install-tools

      - name: Initialize pgrx
        run: cargo pgrx init --pg${{ matrix.pg }} "$(which pg_config)"

      - name: Build (cargo pgrx package)
        run: cargo pgrx package --pg-config "$(which pg_config)"

      - uses: ./.github/actions/assemble-release
        with:
          pg-version: ${{ matrix.pg }}
          os-name: linux
          arch: amd64

  # ── Build binary packages: macOS ─────────────────────────────────────────────
  # Produces one .tar.gz per PG version for macos-arm64.
  build-macos:
    name: "build macos-arm64 pg${{ matrix.pg }}"
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    permissions:
      contents: read
    runs-on: macos-14
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-macos
          cache-on-failure: true

      - uses: ./.github/actions/setup-macos-pg
        with:
          pg-version: ${{ matrix.pg }}

      - uses: ./.github/actions/install-tools

      - name: Initialize pgrx
        run: cargo pgrx init --pg${{ matrix.pg }} "$PG_CONFIG"

      - name: Build (cargo pgrx package)
        run: cargo pgrx package --pg-config "$PG_CONFIG"

      - uses: ./.github/actions/assemble-release
        with:
          pg-version: ${{ matrix.pg }}
          os-name: macos
          arch: arm64

  # ── Create GitHub Release ───────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Fetch full history so git archive includes all tracked files
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create PGXN source zip
        run: |
          VERSION="${GH_REF_NAME#v}"
          git archive \
            --format=zip \
            --prefix="pg_temporal-${VERSION}/" \
            -o "artifacts/pg_temporal-${VERSION}.zip" \
            HEAD

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GH_REF_NAME"
          VERSION="${TAG#v}"

          mapfile -t FILES < <(find artifacts/ -type f | sort)
          gh release create "$TAG" \
            --title "pg_temporal $TAG" \
            --generate-notes \
            "${FILES[@]}"

      # ── Optional: publish to PGXN ───────────────────────────────────────────
      # Requires PGXN_USERNAME and PGXN_PASSWORD repository secrets.
      # See https://manager.pgxn.org/account/register to create an account.
      - name: Publish to PGXN
        if: env.PGXN_USERNAME != ''
        env:
          PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
        run: |
          VERSION="${GH_REF_NAME#v}"
          ZIP="artifacts/pg_temporal-${VERSION}.zip"
          curl --fail-with-body -X POST \
            -u "$PGXN_USERNAME:$PGXN_PASSWORD" \
            -F "archive=@$ZIP" \
            https://manager.pgxn.org/api/v1/dist
