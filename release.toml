# cargo-release configuration
# Docs: https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
#
# Usage:
#   cargo release patch          # dry-run: preview what would happen
#   cargo release patch --execute
#   cargo release minor --execute
#   cargo release major --execute

# This is not a crates.io crate; the release artifact is the GitHub Release.
publish = false

# Require the tree to be clean and up-to-date with the remote before releasing.
verify = true

# Tag format must match the trigger pattern in .github/workflows/release.yml ("v*.*.*")
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"

# Push the commit + tag to trigger the GitHub release workflow.
push = true

# ── Version string replacements ────────────────────────────────────────────────
# Keeps Cargo.toml, pg_temporal.control, and META.json in sync automatically.

[[pre-release-replacements]]
file = "pg_temporal.control"
search = "default_version = '{{prev_version}}'"
replace = "default_version = '{{version}}'"

[[pre-release-replacements]]
# Both the top-level "version" and the one inside "provides" must be updated.
file = "META.json"
search = "\"version\": \"{{prev_version}}\""
replace = "\"version\": \"{{version}}\""
exactly = 2

[[pre-release-replacements]]
# Stamp the release date into CHANGELOG.md and open a fresh Unreleased section.
file = "CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}"
exactly = 1

[[pre-release-replacements]]
# Maintain the comparison link at the bottom of CHANGELOG.md.
file = "CHANGELOG.md"
search = "\\[Unreleased\\]: (https://github\\.com/acalvino4/pg_temporal/compare/.+)\\.\\.\\.HEAD"
replace = "[Unreleased]: https://github.com/acalvino4/pg_temporal/compare/v{{version}}...HEAD\n[{{version}}]: $1...v{{version}}"
exactly = 1
